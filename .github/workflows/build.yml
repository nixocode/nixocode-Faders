# Builds Faders on GitHub's macOS runners for every push and pull request.
# Pushing a tag like `v1.0.0` also publishes a GitHub Release with Faders.zip.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Faders.app
        run: ./scripts/build-app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Faders
          path: build/Faders.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Faders.zip
          generate_release_notes: true
