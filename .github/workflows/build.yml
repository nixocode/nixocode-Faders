# Builds Faders on GitHub's macOS runners for every push and pull request.
# Every push to `main` also publishes (or updates) the GitHub Release for the
# version in Support/Info.plist — bump CFBundleShortVersionString to ship a new one.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Faders.app
        run: ./scripts/build-app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Faders
          path: build/Faders.zip

      - name: Read version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Faders ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/Faders.zip
          generate_release_notes: true
          make_latest: true
