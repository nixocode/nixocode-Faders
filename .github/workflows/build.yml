# Builds Faders on GitHub's macOS runners for every push and pull request.
# Every push to `main` also publishes (or updates) the GitHub Release for the
# version in Support/Info.plist — bump CFBundleShortVersionString to ship a new one.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job below may write, and it runs none
# of the project's code: it just uploads the zip the build job made.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build Faders.app
        run: ./scripts/build-app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Faders
          path: build/Faders.zip

      - name: Read version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to publish releases
      id-token: write       # lets the attest step get a signing certificate
      attestations: write   # lets the attest step save the provenance record
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Faders

      - name: Checksum
        id: checksum
        run: echo "sha256=$(sha256sum Faders.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Record where the zip came from
        # Signed build provenance: anyone can confirm a download was built by
        # this workflow, from this commit, with
        #   gh attestation verify Faders.zip -R nixocode/nixocode-Faders
        # Pinned to an exact commit (v4.2.2), like the release action below.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: Faders.zip

      - name: Publish release
        # Pinned to an exact commit (v2.6.2): a tag can be moved, a commit can't.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Faders ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Faders.zip
          # Shown above the generated notes.
          body: |
            SHA-256 of `Faders.zip`: `${{ steps.checksum.outputs.sha256 }}`

            To check that a download was built here, from this release's commit: `gh attestation verify Faders.zip -R nixocode/nixocode-Faders`
          generate_release_notes: true
          make_latest: true
